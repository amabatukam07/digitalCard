name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, sqlite3, pdo_sqlite, pdo_mysql, bcmath
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Check Laravel Pint code style
        run: php vendor/bin/pint --test

      - name: Run test suite (default cache)
        run: php artisan test --compact

      - name: Run test suite (database cache serialization check)
        env:
          CACHE_STORE: database
        run: php artisan test --compact

      - name: Verify route and config caching
        run: |
          php artisan route:cache
          php artisan config:cache
          php artisan route:clear
          php artisan config:clear

      - name: Install NPM dependencies and build frontend assets
        run: |
          npm ci
          npm run build
